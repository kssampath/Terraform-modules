name: Terraform CI

on:
  pull_request:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform format
        run: terraform fmt -check -recursive
      - name: Terraform validate
        run: terraform validate
      - name: Set up Python
        uses: actions/setup-python@v6
      - name: Install checkov
        run: pip install checkov
      # Zone-redundancy checks skipped: not required for preprod (cost-vs-resilience tradeoff).
      # Repo currently has NO prod env; revisit with inline scoped skips if prod is added.
      - name: Run checkov
        run: checkov -d . --compact --skip-check CKV_AZURE_229,CKV_AZURE_225,CKV_AZURE_212
    
        
      
